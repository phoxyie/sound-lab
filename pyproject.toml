[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soundlab"
version = "0.1.0"
description = "Cleans up MacBook mic recordings for social media"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "phoxyie" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["flask>=3.0", "sounddevice>=0.4"]  # sounddevice: mic recording (CoreAudio)

[project.urls]
Homepage = "https://github.com/phoxyie/sound-lab"

[project.optional-dependencies]
dev = ["playwright>=1.40"]  # + `playwright install webkit`

[project.scripts]
soundlab = "soundlab.cli:main"

[tool.setuptools]
packages = ["soundlab"]

[tool.setuptools.package-data]
soundlab = ["web/*", "web/vendor/*"]
